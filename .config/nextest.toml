# cargo-nextest profiles. CI runs `--profile ci`.
#
# Every test runs in its own process under a per-test clock: a test still
# running at 30s is reported SLOW by name, and one still running at 60s is
# killed and reported TIMEOUT by name. A hung test therefore fails the job in
# about a minute instead of hanging it past GitHub's job limit with no log.
# Slow, hung or flaky tests get deleted, not retried.
[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "30s", terminate-after = 2 }
failure-output = "immediate-final"
status-level = "slow"
final-status-level = "slow"

# A JUnit report of every test that ran, uploaded by CI as an artifact, so
# "what ran" is a file to read rather than a claim.
[profile.ci.junit]
path = "junit.xml"
