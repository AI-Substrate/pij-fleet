[package]
name = "pij-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The client half. `clap` is the verb surface; `reqwest` talks to the daemon over
# loopback; `tokio` is the runtime both halves share.
[dependencies]
clap = { workspace = true }
# `user`: geteuid, so peers.toml must belong to the daemon's own user (plan 164).
nix = { workspace = true, features = ["user"] }
pij-core = { workspace = true }
pij-daemon = { workspace = true }
pij-harnesses = { workspace = true }
# fleet-report (plan 162): seats read-only from the store, transcripts folded in-process.
pij-store = { workspace = true }
pij-unisphere = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
pij-testkit = { workspace = true }
time = { workspace = true, features = ["parsing"] }

# The workspace's ONLY binary. `daemon` and `cli` are two composition roots inside
# it (plan 108 R2): one artifact ships both, so a stale CLI can never meet a newer
# daemon on the same machine.
[[bin]]
name = "pij-rs"
path = "src/main.rs"
