[package]
name = "pij-harnesses"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
pij-core = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Plan 182 (ADR 0001): `local-offset` is libc `localtime_r`, the conversion `ps`
# applies to a start instant, so in-process liveness answers in the same local
# wall time `ps -o lstart=` prints.
time = { workspace = true, features = ["local-offset"] }

# Plan 182 (ADR 0001): the safe `proc_pidinfo` wrapper reads a process's start
# instant on macOS without launching `ps`. Pinned; Linux reads /proc with std.
[target.'cfg(target_os = "macos")'.dependencies]
proc_pidinfo = "=0.1.4"

[dev-dependencies]
pij-testkit = { workspace = true }
