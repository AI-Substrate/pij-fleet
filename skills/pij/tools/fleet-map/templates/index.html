<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #EDF1F0;
  --paper-2: #E2E8E7;
  --surface: #FBFCFB;
  --ink: #142030;
  --ink-2: #3A4757;
  --muted: #66737F;
  --rule: #C5CFD1;
  --dot: #CBD4D5;
  --later: #A9B3B8;
  --alert: #D42A2F;
  --go: #12A150;
  --you: #FFB21A;
  --halo: #EDF1F0;
  --shadow: 0 1px 0 rgba(20,32,48,.04), 0 10px 30px -8px rgba(20,32,48,.28);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D151E; --paper-2: #121C27; --surface: #172330; --ink: #E7EDF1; --ink-2: #C3CDD5; --muted: #8D9AA6;
    --rule: #2A3846; --dot: #1C2834; --later: #4B5966; --alert: #F0484D; --go: #34D27B; --you: #FFB21A; --halo: #0D151E;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -10px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D151E; --paper-2: #121C27; --surface: #172330; --ink: #E7EDF1; --ink-2: #C3CDD5; --muted: #8D9AA6;
  --rule: #2A3846; --dot: #1C2834; --later: #4B5966; --alert: #F0484D; --go: #34D27B; --you: #FFB21A; --halo: #0D151E;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 14px 34px -10px rgba(0,0,0,.7); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: Overpass, "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.4;
  display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #0E7FD6; outline-offset: 2px; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding: 12px 16px 10px; border-bottom: 1px solid var(--rule); background: var(--paper);
  position: relative; z-index: 3;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.roundel { width: 34px; height: 34px; flex: none; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
.brand p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.tally { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.tally > span:not(.yourmove) {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 3px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--rule); font-size: 12.5px; font-weight: 600; color: var(--ink-2);
}
.tally b { font-weight: 800; color: var(--ink); }
.tally i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ---------- map viewport ---------- */
main { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#viewport.dragging { cursor: grabbing; }
#map { display: block; width: 100%; height: 100%; }

.lbl { font-family: Overpass, sans-serif; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; }
.lbl-stop { font-size: 13px; font-weight: 600; }
.lbl-pr { font-size: 11.5px; font-weight: 800; }
.lbl-station { font-size: 16px; font-weight: 800; letter-spacing: -.005em; }
.lbl-phase { font-size: 11px; font-weight: 700; fill: var(--muted); }
.lbl-line { font-size: 12px; font-weight: 800; fill: #fff; stroke: none; }
.history .lbl-stop { font-size: 10.5px; font-weight: 600; fill: var(--muted); }
.history .lbl-pr { font-size: 10px; }
.history .lbl-crew-title, .history .lbl-chip { font-size: 10px; }
.history .lbl-line { font-size: 11px; }
g.history { opacity: .78; }
.lbl-chip { font-size: 11.5px; font-weight: 700; stroke: none; fill: var(--ink-2); }
.lbl-crew-title { font-size: 11px; font-weight: 800; fill: var(--muted); }
.lbl-depot { font-size: 15px; font-weight: 800; stroke: none; }
.awake-only > g > g.asleep { opacity: .14; transition: opacity .18s; }
.toggle { display: inline-flex; align-items: center; gap: 7px; padding: 4px 12px 3px; min-height: 32px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); font-weight: 700; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
.toggle i { width: 8px; height: 8px; border-radius: 50%; background: var(--go); }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.crew { display: grid; gap: 8px; margin: 10px 16px 0; }
.crew .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.crew .row:last-child { border-bottom: 0; padding-bottom: 0; }
.crew .role { font-weight: 800; }
.crew .ctx { color: var(--muted); font-size: 12px; text-align: right; }
.crew .out { grid-column: 1 / -1; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.spine-later { stroke: var(--later); }
.st-later .lbl-station { fill: var(--muted); }
.later-line { filter: saturate(.28); opacity: .5; }
.later-line .lbl { fill: var(--ink-2); }
.stop-later { opacity: .55; }
.hit { cursor: pointer; }
.hit:focus { outline: none; }
.hit:focus-visible .mark-focus { stroke: #0E7FD6; stroke-width: 3; opacity: 1; }
.mark-focus { fill: none; opacity: 0; }
[data-key].hover .mark-focus { opacity: 1; stroke: var(--ink); stroke-width: 2; }
.dim-others [data-line]:not(.lit) { opacity: .22; transition: opacity .18s; }
.dim-yours > g > g:not(.yours) { opacity: .16; transition: opacity .18s; }
.yours-ring { fill: none; stroke: var(--you); stroke-width: 3; opacity: 0; }
.dim-yours .yours-ring { opacity: 1; }
.yourmove { display: inline-flex; align-items: stretch; border-radius: 999px; overflow: hidden; background: var(--you); color: #1B1300; font-weight: 800; font-size: 13px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.yourmove button { border: 0; background: transparent; color: inherit; cursor: pointer; padding: 5px 12px 4px; font-weight: 800; display: inline-flex; align-items: center; gap: 7px; min-height: 32px; }
.yourmove button:hover { background: rgba(0,0,0,.08); }
.yourmove .step { display: none; padding: 5px 10px 4px; font-size: 16px; }
.yourmove.on .step { display: inline-flex; }
.yourmove .dia { width: 10px; height: 10px; transform: rotate(45deg); border: 2px solid #1B1300; border-radius: 1px; }
.yourmove.on #ym-main { background: rgba(0,0,0,.1); }

@media (prefers-reduced-motion: no-preference) {
  .halo { animation: halo 2.6s cubic-bezier(.2,.6,.3,1) infinite; transform-box: fill-box; transform-origin: center; }
  .halo.h2 { animation-delay: 1.3s; }
  @keyframes halo { 0% { transform: scale(.55); opacity: .55; } 100% { transform: scale(1.6); opacity: 0; } }
  .pulse { animation: pulse 2.4s cubic-bezier(.2,.6,.3,1) infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.9); opacity: 0; } }
  .flow { animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -26; } }
  .spin { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
}

/* ---------- controls ---------- */
.controls {
  position: absolute; right: 16px; top: 16px; z-index: 2; display: flex; flex-direction: column; gap: 8px;
}
.group { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.group button {
  width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center;
  font-size: 20px; font-weight: 700; color: var(--ink);
}
.group button + button { border-top: 1px solid var(--rule); }
.group button:hover { background: var(--paper-2); }
.group svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- legend ---------- */
.legend {
  position: absolute; left: 16px; bottom: 16px; z-index: 2; width: min(320px, calc(100% - 32px));
  background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow);
  max-height: calc(100% - 32px); display: flex; flex-direction: column;
}
.legend summary {
  list-style: none; cursor: pointer; padding: 10px 14px 9px; font-weight: 800; font-size: 14px;
  display: flex; align-items: center; gap: 10px;
}
.legend summary::-webkit-details-marker { display: none; }
.legend summary .chev { margin-left: auto; transition: transform .15s; width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2.4; }
.legend[open] summary .chev { transform: rotate(180deg); }
.legend .body { padding: 2px 14px 14px; overflow: auto; }
.legend h3 { margin: 10px 0 5px; font-size: 12px; font-weight: 700; color: var(--muted); }
.legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.legend li { display: flex; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1.2; }
.legend li svg { flex: none; }
.legend li small { color: var(--muted); font-size: 11px; display: block; }
.legend .two { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 10px; }
.legend li > span { min-width: 0; overflow-wrap: anywhere; }
.legend .body { overflow-x: hidden; }

/* ---------- minimap ---------- */
.minimap {
  position: absolute; right: 16px; bottom: 16px; z-index: 2; width: 220px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; cursor: pointer;
}
.minimap svg { display: block; width: 100%; height: auto; }
.minimap .lbl { display: none; }
#mm-view { fill: rgba(14,127,214,.10); stroke: #0E7FD6; stroke-width: 18; vector-effect: non-scaling-stroke; }
#mm-view { stroke-width: 1.5; }

/* ---------- hover card ---------- */
.card {
  position: absolute; z-index: 4; width: min(340px, calc(100vw - 32px)); pointer-events: none;
  background: var(--surface); color: var(--ink); border: 1px solid var(--rule); border-radius: 14px; box-shadow: var(--shadow);
  padding: 0 0 12px; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; overflow: hidden;
}
.card.on { opacity: 1; transform: none; }
.card.pinned { pointer-events: auto; }
.card .band { height: 6px; }
.card .top { padding: 11px 16px 0; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.card h4, .card .sub, .card .wait { overflow-wrap: anywhere; }
.card .top .sw { width: 22px; height: 6px; border-radius: 3px; flex: none; }
.card h4 { margin: 4px 16px 0; font-size: 18px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
.card .sub { margin: 3px 16px 0; font-size: 13px; color: var(--ink-2); }
.card dl { margin: 10px 16px 0; display: grid; grid-template-columns: 82px 1fr; gap: 5px 10px; font-size: 13px; }
.card dt { color: var(--muted); font-weight: 600; }
.card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 1px; border-radius: 999px; font-size: 12px; font-weight: 800; border: 1.5px solid currentColor; }
.seat { display: inline-flex; align-items: center; gap: 6px; }
.seat i { width: 8px; height: 8px; border-radius: 50%; background: var(--later); display: inline-block; }
.seat i.working { background: #19A974; box-shadow: 0 0 0 3px rgba(25,169,116,.2); }
.seat i.idle { background: var(--later); }
.verdicts { display: grid; gap: 3px; }
.verdicts span { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.verdicts b { font-weight: 800; }
.verdicts em { font-style: normal; color: var(--muted); font-size: 12px; }
.verdicts .stale { color: var(--alert); }
.card .wait { margin: 10px 16px 0; padding: 8px 10px 7px; border-radius: 10px; background: var(--paper-2); font-size: 13px; }
.card .wait b { display: block; font-size: 11.5px; color: var(--muted); font-weight: 700; }
.card .hint { margin: 10px 16px 0; font-size: 11.5px; color: var(--muted); }
.card a { color: inherit; }

footer {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; z-index: 1; font-size: 11.5px; color: var(--muted);
  pointer-events: none; white-space: nowrap;
}
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); }

@media (max-width: 720px) {
  header { padding: 10px 16px 8px; }
  .brand h1 { font-size: 18px; }
  .tally { margin-left: 0; }
  .minimap, footer { display: none; }
  .controls { top: 12px; right: 12px; }
  .legend { left: 12px; bottom: 12px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="roundel" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="13" fill="none" stroke="#E5194B" stroke-width="6"/>
      <rect x="1" y="13" width="32" height="8" rx="2" fill="var(--ink)"/>
    </svg>
    <div>
      <h1 id="title">Fleet</h1>
      <p id="stamp">Loading the map data…</p>
    </div>
  </div>
  <div class="tally" id="tally">
    <span class="yourmove" id="yourmove" hidden>
      <button class="step" id="ym-prev" aria-label="Previous item waiting on Jordan">&#8249;</button>
      <button id="ym-main" aria-pressed="false"><i class="dia"></i><span id="ym-text">Your move</span></button>
      <button class="step" id="ym-next" aria-label="Next item waiting on Jordan">&#8250;</button>
    </span>
    <button class="toggle" id="awake" aria-pressed="false" title="Dim every stop whose owner seat isn't working"><i></i>Who's awake</button>
  </div>
</header>
<main>
  <div id="viewport" aria-label="Fleet map. Drag to pan, scroll or pinch to zoom."><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="controls">
    <div class="group">
      <button id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button id="zout" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
    </div>
    <div class="group">
      <button id="fit" title="Fit to screen (0)" aria-label="Fit to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button id="now" title="Jump to now (N)" aria-label="Jump to now"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/></svg></button>
      <button id="theme" title="Switch theme" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
  </div>
  <details class="legend" id="legend">
    <summary>Key<svg class="chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></summary>
    <div class="body" id="legend-body"></div>
  </details>
  <div class="minimap" id="minimap" aria-hidden="true"><svg id="mm"></svg></div>
  <footer id="foot"></footer>
  <div class="card" id="card" role="tooltip"></div>
</main>

<script src="fleet-map.data.js"></script>
<script>
(function () {
'use strict';
const D = window.FLEET_MAP;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map');
const viewport = document.getElementById('viewport');
if (!D) {
  viewport.innerHTML = '<div class="empty"><div><b>No map data.</b><br>Run <code>pij fleet-map generate</code> to write fleet-map.data.js next to this page.</div></div>';
  return;
}

// ======================================================================
// Layout: a pure function of the data. Fixed pitches, fixed lane rule,
// character-count label wrapping (no font measurement), stable order.
// ======================================================================
const G = {
  P: 156,          // pitch between stops on a line
  LEAD: 150,       // from the last stop to the bend toward its junction
  LANE0: 128,      // depth of the first lane from the spine
  LP: 96,          // lane pitch
  SG: 310,         // minimum gap between spine stations
  F: 20,           // fan offset between lines entering one interchange
  CAPH: 30,        // interchange height
  BAND: 58,        // label band on a lane's outer side
  M: 26,           // clearance margin
  R: 26,           // bend radius
  WRAP: 19,        // characters per stop-label line
  SWRAP: 15,       // characters per station-label line
};

function wrap(text, n, maxLines) {
  const words = String(text).split(/\s+/);
  const out = [];
  let cur = '';
  for (const w of words) {
    if (!cur) cur = w;
    else if ((cur + ' ' + w).length <= n) cur += ' ' + w;
    else { out.push(cur); cur = w; }
  }
  if (cur) out.push(cur);
  if (out.length > maxLines) {
    const kept = out.slice(0, maxLines);
    let last = kept[maxLines - 1];
    if (last.length > n - 1) last = last.slice(0, n - 1);
    kept[maxLines - 1] = last + '…';
    return kept;
  }
  return out.map((l) => (l.length > n ? l.slice(0, n - 1) + '…' : l));
}

// ---- Pij Community helpers (character-count widths, so layout stays font-independent) ----
function crewGroups(list) {
  const by = new Map();
  for (const c of list || []) { if (!by.has(c.role)) by.set(c.role, []); by.get(c.role).push(c); }
  return [...by.keys()].sort().map((role) => {
    const xs = by.get(role);
    const live = xs.filter((c) => c.state !== 'released' && c.seat);
    const dot = xs.some((c) => c.state === 'working') ? 'working' : live.length ? 'idle' : null;
    const n = live.length || xs.length;
    return { role, n, label: n > 1 ? `${n} ${role}s` : role, dot, members: xs };
  });
}
const chipW = (g) => g.label.length * 6.7 + (g.dot ? 24 : 14);
function crewRowW(list) {
  const gs = crewGroups(list);
  if (!gs.length) return 0;
  return Math.max(gs.reduce((a, g) => a + chipW(g), 0) + 5 * (gs.length - 1), 13 * 6.6);
}

function layout(D) {
  const spine = D.spine.map((s, i) => ({ ...s, i, x: 0, above: [], below: [] }));
  const byId = new Map(spine.map((s) => [s.id, s]));
  const nowLines = new Set();

  // Every branch: real lines, sidings, then nested stops as stacked sub-lines.
  const branches = [];
  function addBranch(src, kind, parent) {
    const b = {
      id: src.id, name: src.name, colour: src.colour, state: src.state, roadmap: src.roadmap, kind,
      joins: src.joins || null, joinsLine: src.joinsLine || null, at: src.at || null, community: src.community || [],
      stops: src.stops.map((s) => ({ ...s, line: src.id })), subs: [], parent: parent || null,
    };
    branches.push(b);
    return b;
  }
  for (const l of D.lines) addBranch(l, 'line');
  for (const l of D.sidings || []) addBranch(l, 'siding');
  // nested stops -> stacked sub-lines (one level), in data order
  for (const b of branches.slice()) {
    for (const s of b.stops) {
      if (s.stops && s.stops.length) {
        const sub = addBranch({ id: b.id + '/' + s.id, name: s.name + ' stack', colour: b.colour, state: b.state, roadmap: b.roadmap,
          joinsLine: b.id, at: s.id, stops: s.stops }, 'stack');
        sub.realLine = b.id;
      }
    }
  }
  const branchById = new Map(branches.map((b) => [b.id, b]));
  for (const b of branches) {
    b.realLine = b.realLine || b.id;
    if (b.joinsLine) {
      const p = branchById.get(b.joinsLine);
      if (p) { p.subs.push(b); b.parent = p; }
    }
  }
  // inherit "realLine" so stacked sub-lines of a sub-line report the right owner line
  for (const b of branches) if (b.kind === 'stack') b.realLine = branchById.get(b.joinsLine).realLine;

  // occupancy per side: lane -> [[a, b], ...]
  const occ = { up: new Map(), down: new Map() };
  const depth = (k) => G.LANE0 + (k - 1) * G.LP;
  const free = (side, k, a, b) => !(occ[side].get(k) || []).some(([x, y]) => a < y && b > x);
  const take = (side, k, a, b) => { if (!occ[side].has(k)) occ[side].set(k, []); occ[side].get(k).push([a, b]); };

  // width a line's name tag needs at its dead end (character count, not font metrics)
  const tagText = (b) => (b.roadmap && /^\d/.test(b.id) ? b.id + '  ' : '') + b.name;
  const tagW = (b) => (b.kind === 'stack' ? 0 : Math.max(Math.min(tagText(b).length, 34) * 7.1 + 18, crewRowW(b.community)) + 14);
  const tailX = (b) => (b.kind === 'siding' ? 30 : 16);
  function spineClaims(b, side, k, xe) {
    const d = depth(k);
    const n = b.stops.length;
    const xBend = xe - d;
    const xLast = xBend - G.LEAD;
    const xFirst = xLast - (n - 1) * G.P;
    const claims = [[k, xFirst - G.M - tailX(b) - tagW(b), xBend + G.M]];
    for (let j = 1; j < k; j++) claims.push([j, xe - (depth(j) + G.BAND) - G.M, xe - depth(j) + 10 + G.M]);
    return { claims, xFirst, xLast, xBend };
  }
  function subClaims(b, side, k, pk, xp) {

    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (dragMoved > 4) viewport.classList.add('dragging');
    view.x -= dx / view.k; view.y -= dy / view.k; apply();
  } else if (ptrs.size === 2 && pinch) {
    dragMoved = 99;
    const [a, b] = [...ptrs.values()];
    const { l, t } = vpSize();
    zoomAt(pinch.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - l, (a.y + b.y) / 2 - t);

});
function endPtr(e) {
  const wasTap = ptrs.size === 1 && dragMoved <= 4;
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  viewport.classList.remove('dragging');
  if (wasTap && e.type === 'pointerup') onTap(e);
}
viewport.addEventListener('pointerup', endPtr);
viewport.addEventListener('pointercancel', endPtr);
viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const { l, t } = vpSize();
  const isMouseWheel = e.deltaMode === 1 || (e.deltaX === 0 && Math.abs(e.deltaY) >= 50 && Number.isInteger(e.deltaY));
  if (e.ctrlKey || isMouseWheel) {
    const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018) * (e.deltaMode === 1 ? 16 : 1));
    zoomAt(view.k * f, e.clientX - l, e.clientY - t);
  } else {
    view.x += e.deltaX / view.k; view.y += e.deltaY / view.k; apply();
  }
}, { passive: false });
document.getElementById('zin').onclick = () => { const { w, h } = vpSize(); zoomAt(view.k * 1.3, w / 2, h / 2); };
document.getElementById('zout').onclick = () => { const { w, h } = vpSize(); zoomAt(view.k / 1.3, w / 2, h / 2); };
document.getElementById('fit').onclick = fitAll;
document.getElementById('now').onclick = toNow;
window.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  const { w, h } = vpSize();
  if (e.key === '+' || e.key === '=') zoomAt(view.k * 1.3, w / 2, h / 2);
  else if (e.key === '-' || e.key === '_') zoomAt(view.k / 1.3, w / 2, h / 2);
  else if (e.key === '0') fitAll();
  else if (e.key === 'n' || e.key === 'N') toNow();
  else if (e.key === 'Escape') hideCard();
  else if (e.key.startsWith('Arrow') && !(e.target.closest && e.target.closest('[data-key]'))) {
    const s = 80 / view.k;
    if (e.key === 'ArrowLeft') view.x -= s; if (e.key === 'ArrowRight') view.x += s;
    if (e.key === 'ArrowUp') view.y -= s; if (e.key === 'ArrowDown') view.y += s;
    apply();
  } else return;
  e.preventDefault();
});
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(apply, 60); });

// theme
const root = document.documentElement;
try { const t = localStorage.getItem('fleet-map-theme'); if (t === 'light' || t === 'dark') root.dataset.theme = t; } catch (e) {}
document.getElementById('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('fleet-map-theme', root.dataset.theme); } catch (e) {}
};

// ======================================================================
// Hover cards
// ======================================================================
const card = document.getElementById('card');
const main = document.querySelector('main');
let cardKey = null, pinned = false, lastHoverEl = null;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lineName = (id) => { const b = L.branches.find((x) => x.id === id); return b ? b.name : id; };
const STATE_COLOUR = { merged: 'var(--muted)', review: 'var(--go)', building: 'var(--go)', blocked: 'var(--alert)', held: 'var(--ink-2)', waiting: 'var(--ink)', next: 'var(--muted)', later: 'var(--muted)', closed: 'var(--muted)' };

function seatHtml(owner, state) {
  if (!owner) return '';
  const cls = state === 'working' ? 'working' : state === 'idle' ? 'idle' : '';
  const word = state ? (state === 'absent' ? 'no live seat' : state) : '';
  return `<span class="seat"><i class="${cls}"></i>${esc(owner)}${word ? ` <em style="font-style:normal;color:var(--muted)">${esc(word)}</em>` : ''}</span>`;
}
// One verdict on a stop's card. atHead is true at the PR's head, false at an older head, and null
// when the head is unknown (no gh, or gh failed): then show the sha and claim neither.
function verdictHtml(v) {
  const at = !v.at ? ''
    : v.atHead === true ? '<em>at head</em>'
    : v.atHead === false ? `<em class="stale">at ${esc(v.at)}, an older head</em>`
    : `<em>at ${esc(v.at)}</em>`;
  return `<span><b>${esc(v.verdict)}</b> ${esc(v.role)} ${at}</span>`;
}
function cardHtml(item) {
  if (item.kind === 'stop') {
    const { b, s } = item;
    const real = L.branches.find((x) => x.id === b.realLine) || b;
    let h = `<div class="band" style="background:${real.colour}"></div>`;
    h += `<div class="top"><span class="sw" style="background:${real.colour}"></span>${esc(real.name)}${real.roadmap ? ', ' + esc(shortRoadmap(real.roadmap)) : ''}</div>`;
    h += `<h4>${esc(s.name)}</h4>`;
    if (s.title) h += `<p class="sub">${esc(s.title)}</p>`;
    h += '<dl>';
    h += `<dt>Status</dt><dd><span class="pill" style="color:${STATE_COLOUR[s.state] || 'var(--ink)'}">${esc(STOP_LABEL[s.state] || s.state)}</span></dd>`;
    const prName = (s.repo ? esc(s.repo) : '') + '#' + s.pr;
    if (s.pr) h += `<dt>PR</dt><dd>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${prName}</a>` : prName}${s.head ? ` at <b>${esc(s.head)}</b>` : ''}${s.base && s.base !== 'main' ? `<br><em style="font-style:normal;color:var(--muted)">stacked on ${esc(s.base)}</em>` : ''}</dd>`;
    if (s.owner) h += `<dt>Owner</dt><dd>${seatHtml(s.owner, s.ownerState)}</dd>`;
    if (s.verdicts && s.verdicts.length) {
      h += '<dt>Verdicts</dt><dd class="verdicts">' + s.verdicts.map(verdictHtml).join('') + '</dd>';
    } else if (s.pr && s.state !== 'merged') h += '<dt>Verdicts</dt><dd style="color:var(--muted)">none yet</dd>';
    if (s.junction) {
      const subs = L.branches.filter((x) => x.parent === b && x.at === s.id).map((x) => x.kind === 'stack' ? 'stack: ' + x.stops.map((c) => c.pr ? '#' + c.pr : c.name).join(', ') : x.name);
      h += `<dt>Junction</dt><dd>${esc(subs.join('; '))}</dd>`;
    }
    h += '</dl>';
    if (s.waitingOn) h += `<div class="wait"><b>Waiting on</b>${esc(s.waitingOn)}</div>`;
    if (s.note) h += `<p class="sub" style="margin-top:8px">${esc(s.note)}</p>`;
    return h;
  }
  if (item.kind === 'crew') {
    const STATE_WORD = { working: 'working', idle: 'idle', absent: 'no live seat', released: 'released', unknown: 'unknown' };
    let h = `<div class="band" style="background:${item.colour}"></div>`;
    h += `<div class="top">Pij Community${item.depot ? ', shared roles' : ''}</div><h4>${esc(item.title)}</h4>`;
    h += '<div class="crew">' + item.community.map((c) => {
      const cls = c.state === 'working' ? 'working' : c.state === 'idle' ? 'idle' : '';
      const out = c.lastOutput ? `Last output: ${esc(c.lastOutput.kind || 'output')}${c.lastOutput.subject ? ' on ' + esc(c.lastOutput.subject) : ''}${c.lastOutput.result ? ' (' + esc(c.lastOutput.result) + ')' : ''}, ${esc(c.lastOutput.at.slice(0, 10))}` : 'No output from this seat on file';
      return `<div class="row"><span><span class="role">${esc(c.title)}</span><br><span class="seat"><i class="${cls}"></i>${c.seat ? esc(c.seat) : 'no holder'} <em style="font-style:normal;color:var(--muted)">${esc(STATE_WORD[c.state] || c.state)}</em></span></span>`
        + `<span class="ctx">${c.contextK !== undefined ? esc(c.contextK) + 'k context' : ''}</span><span class="out">${out}</span></div>`;
    }).join('') + '</div>';
    return h;
  }
  if (item.kind === 'station') {
    const { st } = item;
    const joining = [...st.above, ...st.below].map((b) => b.name);
    let h = `<div class="band" style="background:${st.state === 'later' ? 'var(--later)' : 'var(--ink)'}"></div>`;
    h += `<div class="top">Spine station ${st.i + 1} of ${S.length}</div><h4>${esc(st.name)}</h4>`;
    h += '<dl>';
    h += `<dt>Status</dt><dd><span class="pill" style="color:${st.state === 'now' ? 'var(--go)' : 'var(--ink-2)'}">${esc(PHASE_LABEL[st.state])}</span></dd>`;
    if (joining.length) h += `<dt>Fed by</dt><dd>${esc(joining.join(', '))}</dd>`;
    h += '</dl>';
    if (st.note) h += `<p class="sub" style="margin-top:8px">${esc(st.note)}</p>`;
    return h;
  }
  const { b } = item;
  const real = L.branches.find((x) => x.id === b.realLine) || b;
  const stops = L.branches.filter((x) => x.realLine === real.id).flatMap((x) => x.stops);
  const counts = {};
  for (const s of stops) counts[s.state] = (counts[s.state] || 0) + 1;
  let h = `<div class="band" style="background:${real.colour}"></div>`;
  h += `<div class="top"><span class="sw" style="background:${real.colour}"></span>${real.kind === 'siding' ? 'Siding' : 'Line'}${real.roadmap ? ', ' + esc(shortRoadmap(real.roadmap)) : ''}</div><h4>${esc(real.name)}</h4>`;
  h += '<dl>';
  h += `<dt>Status</dt><dd><span class="pill" style="color:var(--ink-2)">${esc(PHASE_LABEL[real.state] || real.state)}</span></dd>`;
  const where = real.joins ? (S.find((s) => s.id === real.joins) || {}).name : real.joinsLine ? lineName(real.joinsLine) + ' (junction)' : '';
  if (where) h += `<dt>Joins</dt><dd>${esc(where)}</dd>`;
  h += `<dt>Stops</dt><dd>${Object.entries(counts).map(([k, v]) => `${v} ${esc((STOP_LABEL[k] || k).toLowerCase())}`).join(', ')}</dd>`;
  h += '</dl>';
  return h;
}
function placeCard(cx, cy) {
  const mr = main.getBoundingClientRect();
  const cw = card.offsetWidth, ch = card.offsetHeight;
  let x = cx - mr.left + 18, y = cy - mr.top + 18;
  if (x + cw > mr.width - 12) x = cx - mr.left - cw - 18;
  if (x < 12) x = Math.max(12, (mr.width - cw) / 2);
  if (y + ch > mr.height - 12) y = cy - mr.top - ch - 18;
  if (y < 12) y = 12;
  // never leave the map area, whatever the anchor
  x = Math.min(Math.max(12, x), Math.max(12, mr.width - cw - 12));
  y = Math.min(Math.max(12, y), Math.max(12, mr.height - ch - 12));
  card.style.left = x + 'px'; card.style.top = y + 'px';
}
function showCard(key, cx, cy) {
  const item = keyed.get(key);
  if (!item) return;
  if (cardKey !== key) { card.innerHTML = cardHtml(item); cardKey = key; }
  card.classList.add('on');
  placeCard(cx, cy);
  if (lastHoverEl) lastHoverEl.classList.remove('hover');
  lastHoverEl = svg.querySelector(`[data-key="${CSS.escape(key)}"]`);
  if (lastHoverEl) lastHoverEl.classList.add('hover');
  const lid = item.kind === 'station' || !item.b ? null : item.b.realLine;
  highlightLine(lid);
}
function hideCard(force) {
  if (pinned && !force) return;
  pinned = false; card.classList.remove('on', 'pinned'); cardKey = null;
  if (lastHoverEl) lastHoverEl.classList.remove('hover');
  lastHoverEl = null;
  highlightLine(null);
}
function highlightLine(id) {
  world.classList.toggle('dim-others', !!id);
  world.querySelectorAll('.lit').forEach((n) => n.classList.remove('lit'));
  if (id) world.querySelectorAll(`[data-line="${CSS.escape(id)}"]`).forEach((n) => n.classList.add('lit'));
}
function onHoverMove(e) {
  if (e.pointerType === 'touch' || pinned) return;
  const t = e.target.closest && e.target.closest('[data-key]');
  if (t) showCard(t.getAttribute('data-key'), e.clientX, e.clientY);
  else if (cardKey) hideCard();
}
viewport.addEventListener('pointerleave', () => { if (!pinned) hideCard(); });
function onTap(e) {
  const t = e.target.closest && e.target.closest('[data-key]');
  if (t) { pinned = false; showCard(t.getAttribute('data-key'), e.clientX, e.clientY); pinned = true; card.classList.add('pinned'); }
  else hideCard(true);
}
svg.addEventListener('focusin', (e) => {
  const t = e.target.closest('[data-key]');
  if (!t) return;
  let r = t.getBoundingClientRect();
  const vr = viewport.getBoundingClientRect();
  if (r.right < vr.left || r.left > vr.right || r.bottom < vr.top || r.top > vr.bottom) {
    // keyboard focus moved off-screen: bring it into view first
    view.x += (r.left + r.width / 2 - (vr.left + vr.width / 2)) / view.k;
    view.y += (r.top + r.height / 2 - (vr.top + vr.height / 2)) / view.k;
    apply();
    r = t.getBoundingClientRect();
  }
  pinned = false;
  showCard(t.getAttribute('data-key'), r.right, r.bottom);
});
svg.addEventListener('focusout', () => hideCard(true));

// "Your move": everything waiting on Jordan, in map order (lines, then stops, as drawn)
const yours = allStops.filter((x) => x.s.state === 'waiting');
const ym = document.getElementById('yourmove');
let ymOn = false, ymIdx = 0;
if (yours.length) {
  ym.hidden = false;
  const txt = document.getElementById('ym-text');
  const label = () => { txt.textContent = ymOn ? `Your move: ${ymIdx + 1} of ${yours.length}` : `Your move: ${yours.length}`; };
  label();
  const go = (i) => {
    ymIdx = (i + yours.length) % yours.length;
    label();
    const { b, s } = yours[ymIdx];
    const { w, h } = vpSize();
    view.k = Math.max(view.k, 0.9);
    view.x = s.x - w / view.k / 2; view.y = s.y - h / view.k / 2;
    apply();
    const key = 'stop:' + b.id + ':' + s.id;
    const elx = svg.querySelector(`[data-key="${CSS.escape(key)}"]`);
    const r = elx.getBoundingClientRect();
    pinned = false; showCard(key, r.right, r.bottom); pinned = true; card.classList.add('pinned');
    world.classList.add('dim-yours'); world.classList.remove('dim-others');
  };
  document.getElementById('ym-main').onclick = () => {
    ymOn = !ymOn;
    ym.classList.toggle('on', ymOn);
    document.getElementById('ym-main').setAttribute('aria-pressed', String(ymOn));
    if (ymOn) go(0); else { world.classList.remove('dim-yours'); hideCard(true); label(); }
  };
  document.getElementById('ym-prev').onclick = () => go(ymIdx - 1);
  document.getElementById('ym-next').onclick = () => go(ymIdx + 1);
}

// "Who's awake": dim every stop whose owner seat isn't working right now
const awakeBtn = document.getElementById('awake');
awakeBtn.onclick = () => {
  const on = awakeBtn.getAttribute('aria-pressed') !== 'true';
  awakeBtn.setAttribute('aria-pressed', String(on));
  world.classList.toggle('awake-only', on);
};
{
  const awakeN = allStops.filter((x) => x.s.ownerState === 'working').length;
  awakeBtn.lastChild.textContent = `Who's awake: ${awakeN}`;
  awakeBtn.title = awakeN ? `Dim every stop whose owner seat isn't working (${awakeN} working now)` : 'No stop owner is working right now; turning this on dims every stop';
}

// first view: always the focus station (D.focus), every load
requestAnimationFrame(toFocus);
})();
